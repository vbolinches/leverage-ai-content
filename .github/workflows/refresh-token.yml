name: Refresh Instagram token

# Instagram Login tokens live 60 days. Refreshing one that is still valid mints
# a fresh 60-day token, so running monthly keeps every account alive
# indefinitely and the every-50-days manual chore disappears.
#
# Requires a GH_PAT secret: a GitHub token with permission to write repository
# secrets (fine-grained: Secrets = Read and write on this repo). The default
# GITHUB_TOKEN cannot update secrets, which is why a PAT is needed.
#
# Each refreshed token is masked in logs and written straight back into that
# account's token secret (the name recorded in its account.json). It is never
# printed, committed, or stored anywhere else.

# Weekly, not monthly. A monthly refresh left a single failed run 30 days
# to be noticed (2026-09-01 failed four times before it was fixed by hand).
# Weekly, a failure is simply retried seven days later with ~50 days still
# left on the token, and the monitor's 10-day alarm never comes close.
#
# It also RECORDS the new expiry in accounts/<slug>/token_status.json and
# commits it. It used to only print a notice asking a human to do that; the
# 2026-10-01 refresh renewed leverageai's token to 2026-11-30 but the file
# kept saying 2026-10-30, and the daily monitor failed for a week on a
# token that was fine.
on:
  schedule:
    - cron: "0 3 * * 1"    # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  accounts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.ls.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: ls
        run: echo "matrix=$(python3 accounts.py --list-json)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: accounts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1       # each job commits its token_status.json
      matrix:
        account: ${{ fromJson(needs.accounts.outputs.matrix) }}
    name: refresh ${{ matrix.account.slug }}
    steps:
      - uses: actions/checkout@v5

      - name: Refresh token and update the secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets[matrix.account.token_secret] }}
          TOKEN_SECRET_NAME: ${{ matrix.account.token_secret }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${IG_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret $TOKEN_SECRET_NAME is not set."; exit 1
          fi
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT is not set — cannot write the refreshed token back. See this file's header."
            exit 1
          fi

          echo "--- Requesting a fresh 60-day token for ${{ matrix.account.slug }} (${{ matrix.account.api }}) ---"
          if [ "${{ matrix.account.api }}" = "facebook_page" ]; then
            # Facebook-Login user tokens refresh by exchanging the still-valid
            # token, which needs the app secret (FB_APP_SECRET repo secret).
            if [ -z "${FB_APP_SECRET:-}" ]; then
              echo "::error::FB_APP_SECRET is not set — cannot refresh a facebook_page-route token. Refresh by hand (README)."
              exit 1
            fi
            resp=$(curl -sS -G "https://graph.facebook.com/v21.0/oauth/access_token" \
              --data-urlencode "grant_type=fb_exchange_token" \
              --data-urlencode "client_id=${{ matrix.account.fb_app_id }}" \
              --data-urlencode "client_secret=$FB_APP_SECRET" \
              --data-urlencode "fb_exchange_token=$IG_ACCESS_TOKEN")
          else
            resp=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
              --data-urlencode "grant_type=ig_refresh_token" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          fi

          if echo "$resp" | jq -e '.error' >/dev/null; then
            echo "::error::Refresh failed: $(echo "$resp" | jq -c '.error.message')"
            echo "If the token has already expired it cannot be refreshed — mint a new one by hand (see README)."
            exit 1
          fi

          NEW=$(echo "$resp" | jq -r '.access_token')
          # Facebook's fb_exchange_token omits expires_in for long-lived
          # tokens. jq -r then prints "null", and `set -u` treats a bare word
          # in arithmetic as an unbound variable - which killed this step even
          # though the token itself came back fine.
          EXPIRES=$(echo "$resp" | jq -r '.expires_in // empty')
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "::error::No access_token in refresh response."; exit 1
          fi
          echo "::add-mask::$NEW"

          if [ -n "$EXPIRES" ]; then
            DAYS=$(( EXPIRES / 86400 ))
            echo "New token valid for ~$DAYS days (until $(date -u -d "+$DAYS days" +%F))"
          else
            # Facebook long-lived tokens: the conventional 60 days.
            DAYS=60
            echo "New token issued; no expires_in returned (normal for Facebook long-lived tokens), assuming 60 days"
          fi
          echo "NEW_EXPIRY=$(date -u -d "+$DAYS days" +%F)" >> "$GITHUB_ENV"
          echo "EXPIRY_ASSUMED=$([ -n "$EXPIRES" ] && echo no || echo yes)" >> "$GITHUB_ENV"

          echo "--- Checking GH_PAT ---"
          # Pasted secrets often carry a trailing newline or stray whitespace,
          # which corrupts the Authorization header and reads as a bad token.
          PAT=$(printf '%s' "${GH_PAT}" | tr -d '[:space:]')
          echo "::add-mask::$PAT"

          case "$PAT" in
            ghp_*)        echo "token looks like a classic PAT" ;;
            github_pat_*) echo "token looks like a fine-grained PAT" ;;
            gho_*|ghu_*)  echo "::warning::This looks like an OAuth/user-to-server token, not a PAT." ;;
            *)            echo "::warning::Value does not start with ghp_ or github_pat_ — probably not a PAT at all." ;;
          esac

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          if [ "$code" = "401" ]; then
            echo "::error::GH_PAT rejected (401) even after trimming whitespace. \
          The stored value is not a valid GitHub token. Verify it locally first: \
          curl -H \"Authorization: Bearer <token>\" https://api.github.com/user"
            exit 1
          fi
          echo "PAT authenticates (HTTP $code)"
          export GH_PAT="$PAT"

          echo "--- Writing the new token back to $TOKEN_SECRET_NAME ---"
          pip install --quiet pynacl
          NEW_TOKEN="$NEW" python - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request
          from nacl import encoding, public

          repo = os.environ["REPO"]
          pat = os.environ["GH_PAT"]
          token = os.environ["NEW_TOKEN"]
          secret_name = os.environ["TOKEN_SECRET_NAME"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={
                      "Authorization": f"Bearer {pat}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")[:400]
                  hint = {
                      401: "GH_PAT is invalid, revoked or expired.",
                      403: "GH_PAT authenticates but lacks 'Secrets: Read and write' "
                           "on this repository, or the repo was not selected when the "
                           "fine-grained token was created.",
                      404: "Repo not visible to this token — fine-grained tokens must "
                           "list this repository under Repository access.",
                  }.get(e.code, "")
                  print(f"::error::GitHub API {e.code} on {path}. {hint} {detail}")
                  sys.exit(1)

          key = api("actions/secrets/public-key")
          sealed = public.SealedBox(
              public.PublicKey(key["key"].encode(), encoding.Base64Encoder())
          ).encrypt(token.encode())

          api(f"actions/secrets/{secret_name}", method="PUT", body={
              "encrypted_value": base64.b64encode(sealed).decode(),
              "key_id": key["key_id"],
          })
          print(f"{secret_name} updated.")
          PY

          echo "Done. Token refreshed and stored; nothing was logged."

      # Dates only, never the token. Runs only if the secret was written.
      - name: Record the new expiry date
        env:
          SLUG: ${{ matrix.account.slug }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import date
          slug, exp = os.environ["SLUG"], os.environ["NEW_EXPIRY"]
          path = f"accounts/{slug}/token_status.json"
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, ValueError):
              data = {}
          today = date.today().isoformat()
          data["minted"] = today
          data["expires"] = exp
          data["last_refresh"] = (
              f"auto-refreshed by the Refresh Instagram token workflow on {today}"
              + (" (no expires_in returned; 60 days assumed)"
                 if os.environ.get("EXPIRY_ASSUMED") == "yes" else ""))
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"{path}: expires {exp}")
          PY
          git config user.name "leverage-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "accounts/$SLUG/token_status.json"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "token expiry $NEW_EXPIRY ($SLUG)"
          # Other workflows commit to main too; retry the rebase-and-push.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $(( i * 10 ))
          done
          echo "::warning::could not push token_status.json; the token itself is refreshed"

      # Threads tokens are separate (graph.threads.net) and refresh WITHOUT an
      # app secret — th_refresh_token works on any still-valid long-lived token
      # older than 24h. Runs only for accounts with Threads configured.
      - name: Refresh Threads token and update the secret
        if: matrix.account.threads_token_secret != ''
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets[matrix.account.threads_token_secret] }}
          TOKEN_SECRET_NAME: ${{ matrix.account.threads_token_secret }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${THREADS_ACCESS_TOKEN:-}" ]; then
            echo "::warning::$TOKEN_SECRET_NAME not set — Threads not active yet, skipping."
            exit 0
          fi
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT is not set — cannot write the refreshed token back."
            exit 1
          fi
          resp=$(curl -sS -G "https://graph.threads.net/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
          if echo "$resp" | jq -e '.error' >/dev/null; then
            echo "::error::Threads refresh failed: $(echo "$resp" | jq -c '.error.message // .error')"
            exit 1
          fi
          NEW=$(echo "$resp" | jq -r '.access_token')
          [ -n "$NEW" ] && [ "$NEW" != "null" ] || { echo "::error::no token in response"; exit 1; }
          echo "::add-mask::$NEW"
          EXPIRES=$(echo "$resp" | jq -r '.expires_in // empty')
          if [ -n "$EXPIRES" ]; then
            echo "New Threads token valid ~$(( EXPIRES / 86400 )) days"
          else
            echo "New Threads token issued; no expires_in returned"
          fi
          PAT=$(printf '%s' "${GH_PAT}" | tr -d '[:space:]')
          echo "::add-mask::$PAT"
          export GH_PAT="$PAT"
          pip install --quiet pynacl
          NEW_TOKEN="$NEW" python - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request
          from nacl import encoding, public
          repo, pat = os.environ["REPO"], os.environ["GH_PAT"]
          token, name = os.environ["NEW_TOKEN"], os.environ["TOKEN_SECRET_NAME"]
          def api(path, method="GET", body=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}", method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {pat}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(f"::error::GitHub API {e.code} on {path}: "
                        f"{e.read().decode(errors='replace')[:300]}")
                  sys.exit(1)
          key = api("actions/secrets/public-key")
          sealed = public.SealedBox(public.PublicKey(
              key["key"].encode(), encoding.Base64Encoder())).encrypt(token.encode())
          api(f"actions/secrets/{name}", method="PUT", body={
              "encrypted_value": base64.b64encode(sealed).decode(),
              "key_id": key["key_id"]})
          print(f"{name} updated.")
          PY
