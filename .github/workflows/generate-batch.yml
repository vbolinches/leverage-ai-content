name: Generate content batch

# Closes the last manual loop: authors the next batch for each account whose
# queue is short, renders the slides and reels, and commits them so the daily
# publisher keeps running.
#
# Runs weekly, but only actually generates when a queue is short — so it costs
# nothing while there is still runway.
#
# Requires ANTHROPIC_API_KEY (shared across accounts).
#
# REVIEW: with dry_run false, generated posts publish WITHOUT anyone reading
# them. The scheduled run is the fully-automatic path. Set dry_run true on a
# manual run to render into an artifact without scheduling anything.

on:
  schedule:
    - cron: "0 6 * * 3"    # Wednesdays 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to author"
        default: "7"
      dry_run:
        description: "Render without adding to the queue"
        type: boolean
        default: false
      force:
        description: "Generate even if the queue still has runway"
        type: boolean
        default: false
      account:
        description: "Only this account slug (blank = all)"
        default: ""

env:
  REFILL_BELOW: 7          # generate when fewer than this many posts are queued

jobs:
  accounts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.ls.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        env:
          ONLY: ${{ inputs.account }}
        run: |
          m=$(python3 accounts.py --list-json)
          if [ -n "${ONLY:-}" ]; then
            m=$(echo "$m" | python3 -c "
          import json, os, sys
          only = os.environ['ONLY']
          accts = [a for a in json.load(sys.stdin) if a['slug'] == only]
          if not accts: sys.exit(f'no enabled account {only!r}')
          print(json.dumps(accts, separators=(',', ':')))")
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  generate:
    needs: accounts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1       # jobs commit; serialise the pushes
      matrix:
        account: ${{ fromJson(needs.accounts.outputs.matrix) }}
    name: generate ${{ matrix.account.slug }}
    env:
      ACCOUNT: ${{ matrix.account.slug }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # imageio-ffmpeg ships its own ffmpeg binary, so reel encoding works
          # identically here and locally without a system package.
          # numpy synthesises the Reel audio bed (audio.py) — Instagram's API
          # cannot attach trending audio, so it has to be baked into the file.
          pip install --quiet pillow anthropic imageio-ffmpeg numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Decide whether a batch is needed
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          queued=$(python3 -c "
          import json
          import accounts
          acct = accounts.get()
          s = json.load(open(acct.queue, encoding='utf-8'))
          print(sum(1 for p in s['posts'] if p['status'] == 'queued'))
          ")
          echo "[$ACCOUNT] queued=$queued"
          if [ "$FORCE" = "true" ] || [ "$queued" -lt "$REFILL_BELOW" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "$queued posts still queued (threshold $REFILL_BELOW) — skipping."
          fi

      - name: Author, render and queue
        if: steps.check.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set — cannot author a batch."
            exit 1
          fi
          python3 generate_batch.py \
            --count "${{ inputs.count || 7 }}" \
            ${{ inputs.dry_run && '--dry-run --out review_out' || '' }}

      # A dry run renders into a throwaway runner, so publish the output as an
      # artifact — otherwise there is nothing to actually review.
      - name: Upload batch for review
        if: steps.check.outputs.run == 'yes' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: generated-batch-${{ matrix.account.slug }}
          path: review_out/
          retention-days: 14

      - name: Commit the batch
        if: steps.check.outputs.run == 'yes' && inputs.dry_run != true
        run: |
          git config user.name "leverage-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add accounts
          git diff --cached --quiet || git commit -m "generated batch $(date -u +%F) (${{ matrix.account.slug }})"
          git pull --rebase
          git push
