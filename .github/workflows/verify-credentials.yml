name: Verify Instagram credentials (read-only)

# Read-only preflight, per account, route-aware (verify_account.py handles
# both graph.instagram.com and graph.facebook.com accounts). Publishes
# NOTHING. Safe to run any time.
#
# This is the loud tripwire for the wrong-account hazard: it asserts each
# account's token resolves to that account's own username and ids, and must
# be green before an account is ever enabled.

on:
  workflow_dispatch: {}

jobs:
  accounts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.ls.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "matrix=$(python3 accounts.py --list-json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: accounts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJson(needs.accounts.outputs.matrix) }}
    name: verify ${{ matrix.account.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        env:
          ACCOUNT: ${{ matrix.account.slug }}
          IG_ACCESS_TOKEN: ${{ secrets[matrix.account.token_secret] }}
          IG_USER_ID: ${{ secrets[matrix.account.user_id_secret] }}
          THREADS_ACCESS_TOKEN: ${{ secrets[matrix.account.threads_token_secret] }}
          THREADS_USER_ID: ${{ secrets[matrix.account.threads_user_id_secret] }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 verify_account.py
