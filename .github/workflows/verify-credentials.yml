name: Verify Instagram credentials (read-only)

# Read-only preflight for the Instagram Login API (graph.instagram.com).
# Publishes NOTHING. Safe to run any time.
#
# Critically, this asserts the token resolves to @leverageai.daily. During setup
# the only reachable account was @inmigraforma (a different business), so this
# guard exists to make publishing to the wrong account a loud failure.

on:
  workflow_dispatch: {}

env:
  EXPECTED_USERNAME: leverageai.daily

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check token and confirm target account
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -euo pipefail
          G=https://graph.instagram.com/v21.0

          if [ -z "${IG_ACCESS_TOKEN:-}" ] || [ -z "${IG_USER_ID:-}" ]; then
            echo "::error::IG_ACCESS_TOKEN and/or IG_USER_ID secret is not set."
            exit 1
          fi

          echo "--- Account the token resolves to ---"
          me=$(curl -sS -G "$G/me" \
            --data-urlencode "fields=user_id,username,account_type" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          if echo "$me" | jq -e '.error' >/dev/null; then
            echo "::error::Token rejected: $(echo "$me" | jq -c '.error.message')"
            exit 1
          fi
          echo "$me" | jq '{username, account_type, user_id}'

          actual=$(echo "$me" | jq -r '.username')
          if [ "$actual" != "$EXPECTED_USERNAME" ]; then
            echo "::error::WRONG ACCOUNT. Token resolves to @$actual, expected @$EXPECTED_USERNAME. Refusing to proceed."
            exit 1
          fi
          echo "OK: token belongs to @$actual"

          uid=$(echo "$me" | jq -r '.user_id')
          if [ "$uid" != "$IG_USER_ID" ]; then
            echo "::error::IG_USER_ID secret ($IG_USER_ID) does not match the token's account ($uid)."
            exit 1
          fi
          echo "OK: IG_USER_ID matches the token"

          echo "--- Publishing permission ---"
          # A malformed-container probe: a scope error proves the permission is
          # missing; any other error means the scope is present. Publishes nothing.
          probe=$(curl -sS -X POST "$G/$IG_USER_ID/media" \
            -d "access_token=$IG_ACCESS_TOKEN" 2>&1 || true)
          if echo "$probe" | grep -qi "permission\|scope\|OAuth"; then
            echo "::warning::Possible permission issue: $(echo "$probe" | head -c 300)"
          else
            echo "OK: no scope error on the publish endpoint"
          fi

          echo "--- Image reachability (what Meta's servers see) ---"
          url="https://raw.githubusercontent.com/${{ github.repository }}/main/queue/post01-email-workflow/slide01.png"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = "200" ] \
            && echo "OK: slide images are publicly fetchable (HTTP 200)" \
            || { echo "::error::Slide image returned HTTP $code — repo must be public, files on main."; exit 1; }

          echo ""
          echo "All checks passed. Nothing was published."

      # Reels are fetched by Meta from raw.githubusercontent.com, which serves
      # .mp4 as application/octet-stream. This creates a real REELS container to
      # prove Meta can fetch and transcode it — then stops, without publishing.
      # Containers expire on their own.
      - name: Dry-run the next queued reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          G = "https://graph.instagram.com/v21.0"
          TOKEN, IG = os.environ["IG_ACCESS_TOKEN"], os.environ["IG_USER_ID"]
          RAW = f"https://raw.githubusercontent.com/{os.environ['REPO']}/main"

          sched = json.load(open("queue/schedule.json", encoding="utf-8"))
          reel = next((p for p in sched["posts"]
                       if p["status"] == "queued" and p.get("format") == "reel"), None)
          if not reel:
              print("no queued reel to validate"); raise SystemExit(0)

          url = f"{RAW}/{urllib.parse.quote(reel['video'])}"
          print(f"validating {reel['id']}\n  {url}")

          data = urllib.parse.urlencode({
              "media_type": "REELS", "video_url": url,
              "caption": "validation container - not published",
              "access_token": TOKEN,
          }).encode()
          req = urllib.request.Request(f"{G}/{IG}/media", data=data, method="POST")
          try:
              with urllib.request.urlopen(req) as r:
                  cid = json.load(r)["id"]
          except urllib.error.HTTPError as e:
              print(f"::error::container creation failed: {e.read().decode()[:500]}")
              raise SystemExit(1)
          print(f"  container {cid} created — Meta accepted the URL")

          for i in range(60):
              with urllib.request.urlopen(
                      f"{G}/{cid}?fields=status_code,status&access_token={TOKEN}") as r:
                  s = json.load(r)
              code = s.get("status_code")
              if code == "FINISHED":
                  print("  status FINISHED — Meta fetched and transcoded the video.")
                  print("  Reels publishing works. Container abandoned, nothing posted.")
                  raise SystemExit(0)
              if code == "ERROR":
                  print(f"::error::transcode failed: {s.get('status')}")
                  raise SystemExit(1)
              time.sleep(5)
          print(f"::warning::still {code} after 5 min — slow, not necessarily broken")
          PY
