name: Verify Instagram credentials (read-only)

# Read-only preflight. Confirms the secrets work and reports token expiry.
# Publishes NOTHING. Safe to run any time. Delete once deployment is settled.

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check token, account link, and permissions
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -euo pipefail
          G=https://graph.facebook.com/v21.0

          if [ -z "${IG_ACCESS_TOKEN:-}" ] || [ -z "${IG_USER_ID:-}" ]; then
            echo "::error::IG_ACCESS_TOKEN and/or IG_USER_ID secret is not set."
            exit 1
          fi

          echo "--- Instagram account ---"
          acct=$(curl -sS -G "$G/$IG_USER_ID" \
            --data-urlencode "fields=username,account_type" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          if echo "$acct" | jq -e '.error' >/dev/null; then
            echo "::error::Account lookup failed: $(echo "$acct" | jq -c '.error.message, .error.code')"
            exit 1
          fi
          echo "$acct" | jq '{username, account_type}'

          echo "--- Token scopes and expiry ---"
          dbg=$(curl -sS -G "$G/debug_token" \
            --data-urlencode "input_token=$IG_ACCESS_TOKEN" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          if echo "$dbg" | jq -e '.error' >/dev/null; then
            echo "::error::Token debug failed: $(echo "$dbg" | jq -c '.error.message')"
            exit 1
          fi

          echo "$dbg" | jq '.data | {is_valid, scopes}'

          exp=$(echo "$dbg" | jq -r '.data.expires_at // 0')
          if [ "$exp" = "0" ]; then
            echo "Token expiry: never (or not reported)"
          else
            echo "TOKEN EXPIRES: $(date -u -d "@$exp" +%F) ($(( (exp - $(date -u +%s)) / 86400 )) days from now)"
            echo "REFRESH BY:    $(date -u -d "@$((exp - 864000))" +%F)  (10 days of headroom)"
          fi

          echo "$dbg" | jq -e '.data.scopes | index("instagram_content_publish")' >/dev/null \
            && echo "OK: instagram_content_publish granted" \
            || { echo "::error::Token is MISSING instagram_content_publish — publishing will fail."; exit 1; }

          echo "--- Image reachability (what Meta's servers see) ---"
          url="https://raw.githubusercontent.com/${{ github.repository }}/main/queue/post01-email-workflow/slide01.png"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = "200" ] \
            && echo "OK: slide images are publicly fetchable (HTTP 200)" \
            || { echo "::error::Slide image returned HTTP $code — repo must be public, files on main."; exit 1; }

          echo ""
          echo "All credential checks passed. Nothing was published."
