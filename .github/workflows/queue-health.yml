name: Queue health check

# publish.py exits 0 with "nothing due" when a queue runs dry — by design, so
# the daily cron never fails spuriously. The side effect is that running out of
# content is SILENT: posting just stops and nothing tells you.
#
# This job makes that failure loud, for every account at once. It fails (and
# GitHub emails you) while there is still runway to produce the next batch,
# not after posting has already stopped.

on:
  schedule:
    - cron: "0 9 * * 1"    # Mondays 09:00 UTC — an hour before the daily publish
  workflow_dispatch: {}

env:
  MIN_DAYS_RUNWAY: 5       # shout when fewer than this many queued posts remain

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report remaining runway per account
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import date

          import accounts

          MIN = int(os.environ["MIN_DAYS_RUNWAY"])
          failed = False

          # Fails ONLY when the nightly generator has stopped, which is a
          # fault someone must fix (PC off, Ollama down, a model missing).
          # The signal is accounts/<slug>/last_batch.json, which the nightly
          # job commits every night it runs. Two earlier versions guessed
          # from the queue and raised false alarms: counting queued posts
          # failed every Monday while drafts were held (09-21 to 10-19), and
          # counting held drafts failed on 10-26 an hour after they were
          # released. A short or empty queue with a live generator means
          # tonight's topics failed the truth and clarity checks; that is a
          # warning (no email), not a fault.
          from datetime import datetime, timedelta, timezone
          STALE_DAYS = 3
          week_ago = (date.today() - timedelta(days=7)).isoformat()

          for acct in accounts.list_accounts():
              slug = acct["slug"]
              posts = json.load(open(acct.queue, encoding="utf-8"))["posts"]
              queued = [p for p in posts if p["status"] == "queued"]
              held = [p for p in posts if p["status"] == "held"
                      and p["date"] >= week_ago]
              print(f"[{slug}] queued: {len(queued)}"
                    + (f" (through {max(p['date'] for p in queued)})" if queued else "")
                    + (f"   held drafts: {len(held)}" if held else ""))

              hb_path = os.path.join("accounts", slug, "last_batch.json")
              try:
                  hb = json.load(open(hb_path, encoding="utf-8"))
                  last = datetime.fromisoformat(hb["last_run"])
                  age = (datetime.now(timezone.utc) - last).days
                  print(f"  generator last ran {last:%Y-%m-%d %H:%M} UTC "
                        f"({hb.get('result')}), {age} day(s) ago")
                  alive = age < STALE_DAYS
              except (OSError, ValueError, KeyError):
                  # No heartbeat yet: alive if anything was produced lately.
                  alive = any(p["date"] >= week_ago for p in posts)
                  print(f"  no heartbeat file; recent posts present: {alive}")

              if not alive:
                  print(f"::error::[{slug}] the nightly generator has not run "
                        f"for {STALE_DAYS}+ days. Check that the PC is on, then "
                        f"logs/batch-<date>.log and python run_local_batch.py --check.")
                  failed = True
              elif not queued:
                  print(f"::warning::[{slug}] queue empty: the generator is "
                        f"running but recent topics failed the checks.")
              elif len(queued) < MIN:
                  print(f"  {len(queued)} queued, below {MIN}; the generator is running.")
              else:
                  print(f"  OK")
              if held:
                  print(f"::warning::[{slug}] {len(held)} held draft(s): "
                        + ", ".join(p["id"] for p in held))

          sys.exit(1 if failed else 0)
          PY
        env:
          MIN_DAYS_RUNWAY: ${{ env.MIN_DAYS_RUNWAY }}
