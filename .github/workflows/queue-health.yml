name: Queue health check

# publish.py exits 0 with "nothing due" when a queue runs dry — by design, so
# the daily cron never fails spuriously. The side effect is that running out of
# content is SILENT: posting just stops and nothing tells you.
#
# This job makes that failure loud, for every account at once. It fails (and
# GitHub emails you) while there is still runway to produce the next batch,
# not after posting has already stopped.

on:
  schedule:
    - cron: "0 9 * * 1"    # Mondays 09:00 UTC — an hour before the daily publish
  workflow_dispatch: {}

env:
  MIN_DAYS_RUNWAY: 5       # shout when fewer than this many queued posts remain

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report remaining runway per account
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import date

          import accounts

          MIN = int(os.environ["MIN_DAYS_RUNWAY"])
          failed = False

          # Since 2026-09-24 new posts arrive as HELD drafts the owner
          # releases, and they never count as "queued". Counting only queued
          # posts made this job fail every Monday from 09-21 to 10-19 while
          # drafts sat waiting - an email for a decision, not a fault. It
          # now fails only for what nobody would choose: the generator has
          # produced nothing recent. A short queue with fresh drafts waiting
          # is a warning (no email), naming how many await review.
          from datetime import timedelta
          recent_since = (date.today() - timedelta(days=7)).isoformat()

          for acct in accounts.list_accounts():
              sched = json.load(open(acct.queue, encoding="utf-8"))
              posts = sched["posts"]
              queued = [p for p in posts if p["status"] == "queued"]
              published = [p for p in posts if p["status"] == "published"]
              drafts = [p for p in posts if p["status"] == "held"
                        and p["date"] >= recent_since]

              print(f"[{acct['slug']}] published: {len(published)}   "
                    f"queued: {len(queued)}   recent drafts awaiting review: "
                    f"{len(drafts)}")
              if queued:
                  last = max(p["date"] for p in queued)
                  print(f"  next: {min(p['date'] for p in queued)}   last: {last}")

              if len(queued) >= MIN:
                  print(f"  OK: {len(queued)} posts queued.")
              elif drafts:
                  print(f"::warning::[{acct['slug']}] {len(queued)} post(s) "
                        f"queued and {len(drafts)} draft(s) awaiting review: "
                        + ", ".join(p["id"] for p in drafts)
                        + ". Release the good ones (status -> queued) to publish.")
              else:
                  print(f"::error::[{acct['slug']}] {len(queued)} post(s) queued "
                        f"and NO new drafts in 7 days: the nightly generator has "
                        f"stopped. Check logs/batch-<date>.log on the PC and run "
                        f"python run_local_batch.py --check.")
                  failed = True

          sys.exit(1 if failed else 0)
          PY
        env:
          MIN_DAYS_RUNWAY: ${{ env.MIN_DAYS_RUNWAY }}
