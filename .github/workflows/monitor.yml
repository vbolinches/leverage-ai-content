name: Account monitor

# Read-only digest: follower/post counts, per-post performance, and comments
# awaiting a reply. Publishes nothing, replies to nothing, likes nothing.
# Output lands in the Actions log; a failure emails you.

on:
  schedule:
    - cron: "0 8 * * *"    # daily 08:00 UTC, two hours before the publish run
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Account digest
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 monitor.py
